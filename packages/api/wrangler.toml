name = "elearning-api"
main = "src/index.ts"
compatibility_date = "2024-01-14"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "change-this-in-production-use-secrets"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "video-platform-production"
database_id = "7afcba3b-64fe-47a8-8e68-52ec3b39ec56"

# R2 Buckets are optional for now (Phase 3)
# [[r2_buckets]]
# binding = "VIDEO_BUCKET"
# bucket_name = "elearning-videos"

# KV is optional for now
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxx"

# Queues are optional for now (Phase 3)
# [[queues.producers]]
# binding = "VIDEO_QUEUE"
# queue = "video-processing"

[dev]
port = 8787
local_protocol = "http"
